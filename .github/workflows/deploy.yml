name: Preparar rama produccion
# Cada cambio en main arma el sitio listo para el servidor en la rama `produccion`
# (index.html, assets/, api/, .htaccess en la raíz). Cloudways despliega esa rama.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produccion
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar archivos del sitio
        run: |
          mkdir sitio
          cp -R dist/. sitio/
          cp -R api sitio/api
          cp cloudways.htaccess sitio/.htaccess
      - name: Publicar en la rama produccion
        # Conserva el historial (sin force push) para que Cloudways pueda hacer git pull.
        run: |
          SHA=$(git rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin produccion >/dev/null; then
            git fetch -q origin produccion
            git worktree add -q prod origin/produccion
            git -C prod checkout -q -B produccion
          else
            git worktree add -q --orphan -b produccion prod
          fi
          find prod -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R sitio/. prod/
          git -C prod add -A
          if git -C prod diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -C prod commit -q -m "Sitio generado desde main@$SHA"
          git -C prod push -q origin produccion
